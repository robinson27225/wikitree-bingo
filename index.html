<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WikiTree Bingo</title>
<link rel="icon" href="assets/logo-mark.png">
<link rel="stylesheet" href="shared/style.css">
<style>
main{max-width:560px;margin:0 auto;padding:36px 16px 120px;text-align:center}
main img.mark{width:min(60vw,240px);height:auto}
h1{color:var(--forest);font-size:clamp(34px,8vw,54px);margin:10px 0 6px}
p{color:var(--muted)}
.choices{display:flex;flex-direction:column;gap:14px;margin-top:26px}
.choices a{display:block;text-decoration:none;border-radius:16px;padding:18px;font-weight:700;font-size:1.4em}
.choices .join{background:var(--gold);color:var(--forest)}
.choices .host{background:var(--forest);color:#fff}
.choices small{display:block;font-weight:400;font-size:.65em;opacity:.85}
</style>
</head>
<body>
<main>
  <img class="mark" src="assets/logo-mark.png" alt="WikiTree">
  <h1>WikiTree Bingo</h1>
  <p>A live bingo game for WikiTree events.</p>
  <div class="bingo-head" aria-hidden="true"><span>B</span><span>I</span><span>N</span><span>G</span><span>O</span></div>
  <div class="choices">
    <a class="join" id="join" href="player.html">Join a game<small>You have a 4-letter game code</small></a>
    <a class="host" id="host" href="host.html">Host a game<small>Upload your words and run the draw</small></a>
  </div>
</main>
<footer class="site-foot" id="foot"></footer>
<script type="module">
import { renderFooter } from "./shared/config.js";
renderFooter(document.getElementById("foot"));
// carry a ?worker= override (used when testing against a local server) to both pages
const w = new URLSearchParams(location.search).get("worker");
if (w) for (const id of ["join", "host"]) document.getElementById(id).href += "?worker=" + encodeURIComponent(w);
</script>
</body>
</html>
